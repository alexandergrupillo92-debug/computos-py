<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listo - Cómputos Métricos</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f9;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
  .card{background:#fff;border-radius:12px;padding:30px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08);max-width:380px}
  h1{color:#1A365D;font-size:20px}
  a.btn{display:inline-block;margin-top:14px;background:#1A365D;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold}
  a.volver{display:block;margin-top:14px;color:#2c5282;font-size:13px}
</style>
</head>
<body>
  <div class="card">
    <h1>✅ Documento generado</h1>
    <p>Tu Word de cómputos métricos está listo para descargar.</p>
    <a class="btn" href="/descargar/{{ archivo }}">Descargar Word</a>
    <a class="volver" href="/">← Generar otro</a>
  </div>
</body>
</html>
